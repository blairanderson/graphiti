name: graphiti-mcp

services:
  neo4j:
    image: neo4j:5.26.0
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-demodemo}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${PORT}:80" # Hatchbox routes via Caddy using $PORT
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - graphiti-mcp
    restart: always

  graphiti-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.standalone
    env_file:
      - path: ../.env
        required: false
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      # LLM configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-gpt-4.1-mini}
      # Database configuration
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-demodemo}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      # Application configuration
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-main}
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:-10}
      - CONFIG_PATH=/app/mcp/config/config.yaml
      - PATH=/root/.local/bin:${PATH}
      # API keys — add one CLIENT_KEY_<NAME> per client (value = bearer token)
      - CLIENT_KEY_ANDERSONASSOCIATES=${CLIENT_KEY_ANDERSONASSOCIATES:-}
      - CLIENT_KEY_LOOPED=${CLIENT_KEY_LOOPED:-}
      - CLIENT_KEY_HYDROSEEDCALCULATOR=${CLIENT_KEY_HYDROSEEDCALCULATOR:-}
      - CLIENT_KEY_BIGDETAILPAGE=${CLIENT_KEY_BIGDETAILPAGE:-}
      - CLIENT_KEY_SHIPMENTBOT=${CLIENT_KEY_SHIPMENTBOT:-}
      - CLIENT_KEY_FORMROUTER=${CLIENT_KEY_FORMROUTER:-}
    volumes:
      - ../config/config-docker-neo4j.yaml:/app/mcp/config/config.yaml:ro
    command: ["uv", "run", "main.py"]

volumes:
  neo4j_data:
  neo4j_logs:
